<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimônio Inteligente</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#14213d;--mut:#5b6678;--line:#dbe2ee;--pri:#1d4ed8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#171f35;--ink:#e8ecf5;--mut:#9aa6bd;--line:#27324e;--pri:#5b8cff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#171f35;--ink:#e8ecf5;--mut:#9aa6bd;--line:#27324e;--pri:#5b8cff;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:18px 16px 32px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px}.top img{width:58px;height:58px;border-radius:12px;flex:none}.top b{display:block;font-size:18px;color:var(--pri)}.top span{display:block;font-size:13px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.mut{color:var(--mut);font-size:13px}
.num{font-size:38px;font-weight:700;line-height:1.05;letter-spacing:-.5px}
.tipo{display:inline-block;margin:6px 0 10px;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;color:var(--mut)}
.f{padding:10px 0;border-top:1px solid var(--line)}
.f span{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.f b{font-weight:500;font-size:17px;word-break:break-word}
.row{display:flex;gap:8px;margin-top:14px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
button{font:inherit;border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer}
</style></head>

function card(id){
  const b=D[id];
  if(!b)return '<div class="card"><b style="font-size:20px">Patrimônio '+esc(id)+' não encontrado</b><p class="mut">Avise o setor de TI.</p></div>';

}
function home(){
  return '<div class="card"><b style="font-size:20px">Consulta de patrimônio</b><p class="mut">Aponte a câmera do celular para o QR Code colado no equipamento. Ou digite o número do patrimônio:</p><div class="row"><input id="n" inputmode="numeric" placeholder="Ex.: 359"><button id="ok">Buscar</button></div></div>';
}
let last=null;
function route(){
  let h='';try{h=decodeURIComponent(location.hash.slice(1))}catch(e){}
  if(h===last)return;last=h;
  $('#app').innerHTML=h?card(h):home();
  const ok=$('#ok');if(ok){const go=()=>{const v=$('#n').value.trim();if(v)$('#app').innerHTML=card(code(v))+'<p class="mut"><a href="#" onclick="return false" id="v">&nbsp;</a></p>'};ok.onclick=go;$('#n').onkeydown=e=>{if(e.key==='Enter')go()}}
}
